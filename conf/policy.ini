# Policy engine configuration: thresholds, policy actions, detection
# engine toggles and per-rule overrides. Managed ONLY through
# scripts/policy.py (the admin portal's Rules & Engines tab is read-only);
# the firewall hot-reloads this file, so script edits go live from the
# next scan. [rules:CUSTOM-###] sections are detections added by
# `scripts/policy.py add`.

[thresholds]
sanitize = 0.5
block = 0.85
hard_block = 0.95

[actions]
allow = true
sanitize = true
block = true
partial_block = true
quarantine = true

[detection]
rule_engine = true
semantic_engine = true
context_engine = true
risk_correlation = true

# Gray-band LLM judge (v6.0): runs only when risk lands between min_risk and
# the block threshold. Escalation-only (can never lower a decision) and
# fail-closed (any transport/schema failure blocks the scan). Disabled by
# default — set enabled = true and configure an OpenAI-compatible endpoint.
[llm_judge]
enabled = true
model = gpt-4o-mini
api_base = https://api.openai.com/v1
api_key_env = OPENAI_API_KEY
min_risk = 0.40
timeout = 20

# llm_judge is enabled by default: with OPENAI_API_KEY set it runs; without
# a key it degrades to off automatically (fail-closed, never fabricates).
# Detonation chamber (v6.0/v6.2): behavioral verdict for every scan that is
# not already deterministically blocked (measured on 849 frozen public rows:
# recall 0.465 -> 0.776 at flat FPR). The
# decoy agent holds HMAC-keyed canary secrets and fake tools; the verdict
# comes from observed behavior (canary leaks in 5 encodings, tool fires,
# memory writes), never from the chamber lowering a decision. decoy =
# emulator runs fully offline (deterministic directive emulation); decoy =
# llm uses an OpenAI-compatible endpoint and catches novel paraphrases
# (set PIF_DETONATION_SECRET + OPENAI_API_KEY, see README).
[detonation]
enabled = true
decoy = emulator
min_risk = 0.0
server_secret_env = PIF_DETONATION_SECRET

[rules:RULE-001]
enabled = true

