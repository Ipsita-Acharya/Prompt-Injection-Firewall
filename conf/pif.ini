# PIF main configuration (defaults mirror the built-in Settings defaults).
# Environment variables still override individual values where supported.

[pif]
rules_only = false
model_path = models/classifier.json
max_bytes = 10485760
max_chars = 250000
parser_timeout = 20.0
ocr_enabled = true
session_ttl = 900.0
max_sessions = 1000
block_threshold = 0.85
hard_block_threshold = 0.95
sanitize_threshold = 0.5
quarantine_enabled = true
quarantine_dir = quarantine
; Per-scan SQLite report (request, decision, findings) read by the UI_PIF portal.
; Concurrency (v6.3): simultaneous scans and file-parser workers.
scan_concurrency = 32
parser_concurrency = 12

report_db_enabled = true
report_db_path = data/report.db

pdf_max_pages = 100
[logging]
dir = logs
level = INFO
max_bytes = 10485760
backup_count = 5
console = false
content = false
content_max_chars = 0
simple = true
script_details = false
scan_id = false
