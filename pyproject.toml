[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-firewall"
version = "0.1.0"
description = "Local, fail-closed prompt injection inspection and agent guards"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pypdf>=6,<7", "python-docx>=1.2,<2", "beautifulsoup4>=4.13,<5",
  "markdown-it-py>=4,<5", "scikit-learn>=1.7,<2", "numpy>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
ocr = ["Pillow>=11,<13", "pytesseract>=0.3.13,<1", "pypdfium2>=4,<6"]
forensics = ["pdfplumber>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["pif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]